name: Public EmbeddingGemma Specialist Benchmark

on:
  push:
    branches:
      - public-benchmark-embeddinggemma-v1
    paths:
      - "benchmarks/deadline_specialist_v1/**"
      - ".github/workflows/public-embeddinggemma-benchmark.yml"
      - "core/retrieval/onnx_embed.py"
      - "models_manifest.json"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THEMIS_ONNX_THREADS: "4"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install CPU benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "onnxruntime==1.23.2" "tokenizers>=0.20,<1"

      - name: Run canonical Themis EmbeddingGemma probe
        run: |
          python benchmarks/deadline_specialist_v1/public_embeddinggemma_probe.py

      - name: Upload public benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themis-embeddinggemma-specialist-benchmark
          path: benchmarks/deadline_specialist_v1/public_embeddinggemma_results.json
          if-no-files-found: warn
